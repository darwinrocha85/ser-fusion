[project]
name = "serfusion"
version = "0.1.0"
description = "Fusión tardía multimodal para reconocimiento de emociones: pipeline limpio, reproducible y verificable."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.11",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serfusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
